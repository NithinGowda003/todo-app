{% extends "base.html" %}

{% block content %}
  <h1>📝 My To-Do List</h1>

  <form action="{{ url_for('add') }}" method="POST" class="add-form">
    <input type="text" name="title" placeholder="What needs to be done?" required autofocus>
    <button type="submit">Add</button>
  </form>

  {% if tasks %}
    <ul class="task-list">
      {% for task in tasks %}
        <li class="{{ 'done' if task.done else '' }}">
          <span>{{ task.title }}</span>
          <div class="actions">
            <form action="{{ url_for('toggle', task_id=task.id) }}" method="POST">
              <button class="btn-small">{{ 'Undo' if task.done else 'Done' }}</button>
            </form>
            <form action="{{ url_for('delete', task_id=task.id) }}" method="POST">
              <button class="btn-small btn-danger">Delete</button>
            </form>
          </div>
        </li>
      {% endfor %}
    </ul>
  {% else %}
    <p class="empty">No tasks yet. Add one above!</p>
  {% endif %}
{% endblock %}
